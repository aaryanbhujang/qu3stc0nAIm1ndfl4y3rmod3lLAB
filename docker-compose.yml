version: "3.9"
services:
  mindflayer:
    build: .
    container_name: mindflayer-app
    ports:
      - "80:8000"    # Map host port 80 to container port 8000
    environment:
      - FLASK_ENV=production
      - PORT=8000
      - MAX_MODEL_MB=50
      - SECRET_KEY=mindflayer-secret-key
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  uploads:
